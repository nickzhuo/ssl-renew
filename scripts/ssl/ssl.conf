# =============================================================================
#  证书签发全局策略   scripts/ssl/ssl.conf
# -----------------------------------------------------------------------------
#  本文件不含任何密钥，可以安全提交到 Git。
#  密钥在 secrets.env（已被 gitignore），域名列表在 domains.conf。
#
#  ★ 本文件是「每台机器一份」：换机器部署时，下面带 ★ 的两项要按这台机器改。
# =============================================================================


# -----------------------------------------------------------------------------
#  ACME 账号邮箱（必填）
# -----------------------------------------------------------------------------
#  用于 Let's Encrypt 的账号注册、证书到期提醒与账号找回。
SSL_EMAIL="sidewindermax@hotmail.com"


# -----------------------------------------------------------------------------
#  证书输出位置
# -----------------------------------------------------------------------------
# ★ 输出根目录。写**绝对路径**最省事 —— 消费方（nginx / Traefik）里直接引用，
#   脚本放在哪儿都不影响。写相对路径则相对"项目根目录"（脚本目录的上两级）解析。
#
#   两台机器的取值（按自己那台填）：
#      Traefik 机器：  SSL_OUTPUT_DIR="/root/cert"
#      nginx   机器：  SSL_OUTPUT_DIR="/etc/nginx/ssl"
SSL_OUTPUT_DIR="cert"
# ★ 输出布局：
#     flat   = <目录>/<主域名>.fullchain.pem   ← 推荐：nginx / Traefik 都用这个
#     subdir = <目录>/<主域名>/fullchain.pem   每个域名一个子目录
#
#   flat 的好处：配置里写 <域名>.fullchain.pem，一眼能看出是哪张证书，
#   加域名也不用改目录结构。
SSL_OUTPUT_LAYOUT="flat"


# -----------------------------------------------------------------------------
#  systemd unit 名  ★ 每台机器必须不同
# -----------------------------------------------------------------------------
#  装配出来的 unit 是 <SSL_UNIT_NAME>.service / <SSL_UNIT_NAME>.timer。
#
#  ★ 同一台机器上如果跑多套（既管 Traefik 又管 nginx），unit 同名会互相覆盖；
#    而且 ssl-status.sh 也会去查一个不存在的 unit，报「未安装」，白误导一轮排查。
#
#   两台机器的取值（与本机**已经装好的那个**保持一致）：
#      Traefik 机器：  SSL_UNIT_NAME="ssl-renew"
#      nginx   机器：  SSL_UNIT_NAME="ssl-nginx-renew"
#
#  ⚠️ 升级到本版本后第一次要确认这一行：
#     如果这台机器上早就装了 ssl-renew.timer（或 ssl-nginx-renew.timer），
#     就把 SSL_UNIT_NAME 改成那个**实际在用的**名字。不确定就跑一次
#     ./ssl-status.sh，它会告诉你本机到底装了哪个名字。
SSL_UNIT_NAME="ssl-renew"


# -----------------------------------------------------------------------------
#  密钥算法
# -----------------------------------------------------------------------------
#  ec-256  = ECDSA P-256（推荐：体积小、握手快、Let's Encrypt 全面支持）
#  ec-384  = ECDSA P-384
#  2048    = RSA 2048（仅兼容极老旧客户端时才用）
SSL_KEY_LENGTH="ec-256"


# -----------------------------------------------------------------------------
#  续期阈值（每个域名可在 domains.conf 里单独覆盖）
# -----------------------------------------------------------------------------
#  证书剩余天数 <= 该值时视为"需要续期"。
#
#  ★ 说明：续期时机由本套脚本自己判断，不依赖 acme.sh 的内部调度，
#    所以这里的数字就是你实际生效的阈值。
#    Let's Encrypt 证书有效期 90 天，留 30 天余量比较稳妥。
SSL_RENEW_DAYS="30"


# -----------------------------------------------------------------------------
#  DNS 传播等待
# -----------------------------------------------------------------------------
#  写完全部 TXT 记录后，等待多久再让 Let's Encrypt 来校验（秒）。
#    · 腾讯云 DNSPod 生效通常很快，20 秒足够；若偶发校验失败可调到 60。
#    · GoDaddy 的 API 限流偏严、生效也慢一些，acme.sh 的 dns_gd 钩子内部
#      本身还会再 sleep 10 秒；批量签多张时建议调到 60。
SSL_DNS_SLEEP="20"


# -----------------------------------------------------------------------------
#  证书更新后的重载命令（**建议留空**，改用 renewpost.sh）
# -----------------------------------------------------------------------------
#  真正的做法是写一个 renewpost.sh，脚本会**自动发现**它，这里什么都不用配。
#  仓库里带两个模板，挑一个复制成 renewpost.sh 就行：
#      renewpost.sh.example.nginx    nginx -t → systemctl restart nginx → 校验 is-active
#      renewpost.sh.example.docker   docker compose up --force-recreate → 校验容器 running
#  钩子能完成一串动作、还能在校验失败时返回非 0，比一行命令强得多。
#
#  这里只是兜底：**没有 renewpost.sh 时**才会用到它。
#  无论用哪个，重载动作都只在"确实有证书更新"后执行一次（不是每张证书跑一遍）。
#  示例：
#    SSL_RELOAD_CMD="systemctl reload nginx"
SSL_RELOAD_CMD=""


# -----------------------------------------------------------------------------
#  失败处理策略
# -----------------------------------------------------------------------------
#  1 = 某个域名签发失败时，记录错误并继续处理后面的域名（推荐，多域名场景）
#  0 = 遇到第一个失败立即中止
SSL_KEEP_GOING="1"
