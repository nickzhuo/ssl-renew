# =============================================================================
#  域名列表   scripts/domains.conf
# -----------------------------------------------------------------------------
#  每行 = 一张证书。想加域名就直接加一行 / 往一行里加，本文件不含密钥，
#  可以安全提交到 Git。
#
#  格式：
#      <域名1> <域名2> ...        [ |  选项 ]
#
#     · 同一张证书的多个域名用空格分隔
#     · 第一个域名是"主域名"，必须是非泛域名（它决定证书目录名和输出子目录）
#     · 泛域名 *.example.com 不包含 example.com 本身，通常两个都写
#
#  选项（可省略，多个用空格分隔）：
#     renew=<天数>      这张证书的续期阈值，默认取 ssl.conf 的 SSL_RENEW_DAYS
#     dir=<名称>        这张证书的输出子目录名，默认取主域名
#     dns=<服务商>      这个域名用哪个 DNS 服务商做 DNS-01 验证，默认 tencent
#                       可选值：tencent（腾讯云 DNSPod） / godaddy
#     account=<账号名>  这个域名用该服务商下的哪个账号，默认 default
#                       （腾讯云对应 secrets.env 里的 Tencent_SecretId_<账号名>）
#                       （GoDaddy 对应 secrets.env 里的 GD_Key_<账号名>）
#
#  示例：
#      example.com www.example.com *.example.com
#      api.example.com                            | renew=20
#      shop.com *.shop.com                        | dns=godaddy
#      pay.example.com *.pay.example.com           | dns=godaddy account=GD2
#      m.example.com                              | dns=tencent account=ACC2
#
#  ★ 每张证书各自独立管理到期时间：脚本会逐个检查剩余天数，
#    只有剩余 <= 该证书的阈值（或域名列表发生变化）时才去续期。
#
#  ★★ 一张证书里的所有域名必须同属「同一个 DNS 服务商 + 同一个账号」——
#     DNS-01 验证是一次调用把整行的 TXT 记录写进去，而 acme.sh 一次只能用
#     一套凭据（一个服务商的一个账号）。这是 ACME 的固有限制，不是脚本限制。
#     域名跨服务商 / 跨账号时，拆成两行，各自带上 dns= / account=：
#
#       aaa.com *.aaa.com | dns=godaddy                 # aaa.com 解析在 GoDaddy
#       bbb.com *.bbb.com | dns=tencent account=ACC2    # bbb.com 在腾讯云账号 ACC2
#       ccc.com *.ccc.com                               # 不写 = tencent / default
#
#  ★ 动手前先确认域名到底托管在哪家：  dig +short NS <域名>
#      NS 含 dnspod            -> dns=tencent
#      NS 含 domaincontrol.com -> dns=godaddy
#    「在 GoDaddy 注册」不等于「解析托管在 GoDaddy」，要看 NS。
# =============================================================================


# -----------------------------------------------------------------------------
#  下面是示例行，请改成你自己的域名（把行首的 # 去掉）
# -----------------------------------------------------------------------------

# 主站 + www + 泛域名，一张证书搞定（走默认：腾讯云 / 账号 default）
# example.com www.example.com *.example.com

# 独立子域，单独一张证书
# api.example.com

# 自定义续期阈值和输出目录
# shop.com *.shop.com  | renew=45 dir=shop-cert

# 指定用另一个腾讯云账号验证（对应 secrets.env 里的 Tencent_SecretId_ACC2）
# pay.example.com *.pay.example.com | account=ACC2

# 域名解析托管在 GoDaddy（对应 secrets.env 里的 GD_Key / GD_Secret）
# shop.com *.shop.com  | dns=godaddy

# GoDaddy 的第二个账号（对应 secrets.env 里的 GD_Key_GD2 / GD_Secret_GD2）
# outlet.com *.outlet.com | dns=godaddy account=GD2


