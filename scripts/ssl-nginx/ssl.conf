# =============================================================================
#  证书签发全局策略   scripts/ssl-nginx/ssl.conf   ——  nginx 机器专用
# -----------------------------------------------------------------------------
#  ★ 本目录只放「nginx 这台机器自己的配置」，代码全部在 ../ssl/ 。
#    升级时把 ../ssl/ 里的 *.sh 覆盖到本目录即可，本文件**不许被覆盖**。
#
#  本文件不含任何密钥，可以安全提交到 Git。
#  密钥在 secrets.env（已被 gitignore），域名列表在 domains.conf。
# =============================================================================


# -----------------------------------------------------------------------------
#  ACME 账号邮箱（必填）
# -----------------------------------------------------------------------------
#  用于 Let's Encrypt 的账号注册、证书到期提醒与账号找回。
SSL_EMAIL=""


# -----------------------------------------------------------------------------
#  证书输出位置   ★ nginx 机器取值
# -----------------------------------------------------------------------------
#  /etc/nginx/ssl 在 nginx 的标准路径下：
#    · nginx 配置里直接引用，脚本放哪儿都不影响
#    · SELinux 上下文天然正确（换到 /root/cert 等位置要额外 chcon）
SSL_OUTPUT_DIR="/etc/nginx/ssl"

#  输出布局：
#    flat   = /etc/nginx/ssl/<主域名>.fullchain.pem   ← nginx 用这个
#    subdir = /etc/nginx/ssl/<主域名>/fullchain.pem
#
#  flat 的好处：nginx 配置里写 <域名>.fullchain.pem，一眼看出是哪张证书。
SSL_OUTPUT_LAYOUT="flat"


# -----------------------------------------------------------------------------
#  systemd unit 名   ★ nginx 机器取值
# -----------------------------------------------------------------------------
#  装配出来的 unit 是 <SSL_UNIT_NAME>.service / <SSL_UNIT_NAME>.timer。
#
#  ⚠️ 同一台机器上如果跑多套（既管 Traefik 又管 nginx），unit 同名会互相覆盖；
#     而且 ssl-status.sh 也会去查一个不存在的 unit、报「未安装」，白误导排查。
#
#  本机（b919p4，nginx）已经装了 ssl-nginx-renew.timer，所以这一行必须保持：
SSL_UNIT_NAME="ssl-nginx-renew"


# -----------------------------------------------------------------------------
#  密钥算法
# -----------------------------------------------------------------------------
#  ec-256  = ECDSA P-256（推荐：体积小、握手快、Let's Encrypt 全面支持）
#  ec-384  = ECDSA P-384
#  2048    = RSA 2048（仅兼容极老旧客户端时才用）
SSL_KEY_LENGTH="ec-256"


# -----------------------------------------------------------------------------
#  续期阈值（每个域名可在 domains.conf 里单独覆盖）
# -----------------------------------------------------------------------------
#  证书剩余天数 <= 该值时视为"需要续期"。
#  续期时机由本套脚本自己判断，不依赖 acme.sh 的内部调度，
#  所以这里的数字就是你实际生效的阈值。LE 证书有效期 90 天，留 30 天余量稳妥。
SSL_RENEW_DAYS="30"


# -----------------------------------------------------------------------------
#  DNS 传播等待
# -----------------------------------------------------------------------------
#  写完全部 TXT 记录后，等待多久再让 Let's Encrypt 来校验（秒）。
#    · 腾讯云 DNSPod 生效通常很快，20 秒足够；若偶发校验失败可调到 60。
#    · GoDaddy 的 API 限流偏严、生效也慢一些，acme.sh 的 dns_gd 钩子内部
#      本身还会再 sleep 10 秒；本机如果有 GoDaddy 域名，建议调到 60。
SSL_DNS_SLEEP="20"


# -----------------------------------------------------------------------------
#  证书更新后的重载命令（**必须留空**，本机用 renewpost.sh）
# -----------------------------------------------------------------------------
#  本机已经生成了 renewpost.sh（来自 ../ssl/renewpost.sh.example.nginx）：
#        nginx -t（验配置 + 验证书可读） → systemctl restart nginx → 校验 is-active
#  ★ 用 restart 而不是 reload：reload 的旧 worker 要等长连接处理完才退、
#    且 URL 会话缓存不清，实测会出现"证书换了但客户端还是旧的"。
#    详见 ../ssl/README.md 第九节第 2 小节。
#
#  这里只是兜底：**没有 renewpost.sh 时**才会用到它。
#  无论用哪个，重载动作都只在"确实有证书更新"后执行一次（不是每张证书跑一遍）。
SSL_RELOAD_CMD=""


# -----------------------------------------------------------------------------
#  失败处理策略
# -----------------------------------------------------------------------------
#  1 = 某个域名签发失败时，记录错误并继续处理后面的域名（推荐，多域名场景）
#  0 = 遇到第一个失败立即中止
SSL_KEEP_GOING="1"
